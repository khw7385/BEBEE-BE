# ========================================
# Bebee 개발 환경 Docker Compose 설정
# ========================================
#
# 이 파일은 Bebee 개발에 필요한 인프라 서비스들을 정의합니다.
# MySQL과 Redis를 Docker 컨테이너로 실행하여 개발 환경을 구성합니다.
#
# 환경 변수 사용:
# - .env 파일에서 환경 변수를 읽어와서 사용
# - 환경 변수가 없으면 기본값 사용
#
# 실행 방법:
#   docker-compose up -d    # 백그라운드에서 실행
#   docker-compose down     # 컨테이너 중지 및 삭제
#   docker-compose logs     # 로그 확인

# Docker Compose 버전
version: '3.8'

# 프로젝트 이름 지정 (Docker Compose 버전 호환성으로 인해 주석 처리)
# name: bebee

# 서비스 정의
services:
  # ========================================
  # MySQL 데이터베이스 서비스
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      # 환경 변수 설정 (.env 파일에서 읽어오거나 기본값 사용)
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}      # MySQL root 사용자 비밀번호
      MYSQL_USER: ${DB_USERNAME:-bebee}                    # 생성할 사용자 이름
      MYSQL_PASSWORD: ${DB_PASSWORD:-bebee1234}            # 생성할 사용자 비밀번호
    ports:
      - "3306:3306"
    volumes:
      # 데이터 영속성
      - mysql_data:/var/lib/mysql
      # 초기화 스크립트 마운트
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - bebee-network

  # ========================================
  # Redis 데이터베이스 서비스
  # ========================================
  redis:
    image: redis:6.2-alpine
    container_name: redis-db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # 데이터 영속성
      - redis_data:/data
    networks:
      - bebee-network

  # ========================================
  # MongoDB 데이터베이스 서비스
  # ========================================
  mongodb:
    image: mongo:8.0
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root1234
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db
    networks:
      - bebee-network

  # ========================================
  # LocalStack 서비스
  # ========================================
  localstack:
    container_name: localstack
    image: localstack/localstack:3
    ports:
      - "4566:4566" # LocalStack Gateway (모든 AWS 서비스)
#      - "4510-4559:4510-4559" # 필요하다면
    environment:
      - AWS_DEFAULT_REGION=ap-northeast-2
      - SERVICES=sqs,sns,s3
      - DATA_DIR=/tmp/localstack/data
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - EAGER_SERVICE_LOADING=1
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./docker/localstack/init:/etc/localstack/init/ready.d"
    networks:
      - bebee-network

  # ========================================
  # Prometheus 모니터링 서비스
  # ========================================
  # 메트릭 수집 및 저장을 담당하는 시계열 데이터베이스
  # Spring Boot Actuator의 /actuator/prometheus 엔드포인트에서 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"                                           # Prometheus Web UI 포트
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # 설정 파일 마운트
      - prometheus_data:/prometheus                           # 데이터 영속성
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'        # 설정 파일 경로
      - '--storage.tsdb.path=/prometheus'                     # 데이터 저장 경로
      - '--web.enable-lifecycle'                              # HTTP API로 설정 리로드 가능
    restart: unless-stopped
    networks:
      - bebee-network

  # ========================================
  # Grafana 대시보드 서비스
  # ========================================
  # Prometheus에서 수집한 메트릭을 시각화하는 대시보드
  # 기본 로그인: admin / admin
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"                                           # Grafana Web UI 포트
    volumes:
      - grafana_data:/var/lib/grafana                         # 데이터 영속성
      - ./docker/grafana/provisioning:/etc/grafana/provisioning  # 자동 프로비저닝 설정
    environment:
      - GF_SECURITY_ADMIN_USER=admin                          # 관리자 계정
      - GF_SECURITY_ADMIN_PASSWORD=admin                      # 관리자 비밀번호
      - GF_USERS_ALLOW_SIGN_UP=false                          # 회원가입 비활성화
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - bebee-network

# ========================================
# 볼륨 정의 (Volumes)
# ========================================
volumes:
  mysql_data:
  redis_data:
  mongo_data:
  localstack_data:
  prometheus_data:
  grafana_data:

# ========================================
# 네트워크 정의 (Networks)
# ========================================
networks:
  bebee-network:
    driver: bridge
