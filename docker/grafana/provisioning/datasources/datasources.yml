# ========================================
# Grafana 데이터소스 자동 프로비저닝 설정
# ========================================
#
# Grafana 시작 시 자동으로 Prometheus 데이터소스를 등록합니다.

apiVersion: 1

datasources:
  # ========================================
  # Prometheus 데이터소스
  # ========================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090    # Docker 네트워크 내부에서 접근
    isDefault: true
    editable: true